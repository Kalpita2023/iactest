name: "Terraform Validation Test"

# যখনই আপনি কোনো ফিচার ব্রাঞ্চে কোড পুশ করবেন, এটি চালু হবে
on:
  push:
    branches:
      - 'feature/*'

jobs:
  validate-code:
    name: "Check Syntax and Logic"
    runs-on: ubuntu-latest
    
    steps:
      # ১. কোড চেকআউট করা
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ২. টেরাফর্ম সেটআপ করা
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # ৩. ভ্যালিডেশন চেক (Azure এক্সেস ছাড়া)
      - name: Terraform Validate
        working-directory: ./infra
        run: |
          terraform init -backend=false
          terraform validate
